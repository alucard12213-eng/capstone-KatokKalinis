<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - KatokKalinis</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">KatokKalinis</div>
            <div class="sidebar-role" id="sidebar-role"></div>
            <nav class="sidebar-nav" id="sidebar-nav"></nav>
            <div class="sidebar-footer">
                <button class="btn btn-logout" onclick="logout()">Logout</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <h2>Reports</h2>
                <div id="topbar-user"></div>
            </header>
            
            <section class="content">
                <div class="stats-grid report-stats">
                    <div class="stat-card"><h3>Reports This Month</h3><div class="value" id="stat-total">...</div></div>
                    <div class="stat-card"><h3>Pending Review</h3><div class="value" id="stat-pending">...</div></div>
                    <div class="stat-card"><h3>Completed</h3><div class="value" id="stat-completed">...</div></div>
                    <div class="stat-card"><h3>Avg Response Time</h3><div class="value" id="stat-response">...</div></div>
                </div>

                <div class="card recent-reports-card">
                    <div class="card-header">
                        <h3>Recent Reports</h3>
                    </div>
                    <div id="table-body" class="report-list"><p>Loading reports...</p></div>
                </div>
            </section>
        </main>
    </div>

    <!-- Update Status Modal -->
    <div id="status-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Update Report Status</h3>
                <span class="close-btn" onclick="closeModal()">&times;</span>
            </div>
            <form id="status-form">
                <input type="hidden" id="report-id">
                <div class="form-group">
                    <label>Status</label>
                    <select id="status-select" class="form-control">
                        <option value="pending">Pending</option>
                        <option value="reviewed">Reviewed</option>
                        <option value="resolved">Resolved</option>
                        <option value="rejected">Rejected</option>
                    </select>
                </div>
                <button type="submit" class="btn">Update Status</button>
            </form>
        </div>
    </div>

    <div id="details-modal" class="modal">
        <div class="modal-content report-details-modal">
            <div class="modal-header">
                <h3 id="details-title">Report Details</h3>
                <span class="close-btn" onclick="closeDetailsModal()">&times;</span>
            </div>
            <div id="report-details" class="report-details"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        const endpoint = '/reports';

        async function loadData() {
            const container = document.getElementById('table-body');
            try {
                const res = await apiRequest(endpoint);
                const data = res.reports || [];
                const pending = data.filter(item => item.status === 'pending' || item.status === 'reviewed').length;
                const completed = data.filter(item => item.status === 'resolved').length;
                const responseTimes = data.map(item => (item.created_at && item.updated_at) ? (new Date(item.updated_at) - new Date(item.created_at)) / 3600000 : null).filter(value => value !== null && value >= 0);
                const avgResponse = responseTimes.length ? `${(responseTimes.reduce((sum, value) => sum + value, 0) / responseTimes.length).toFixed(1)} hrs` : 'N/A';
                document.getElementById('stat-total').textContent = data.length;
                document.getElementById('stat-pending').textContent = pending;
                document.getElementById('stat-completed').textContent = completed;
                document.getElementById('stat-response').textContent = avgResponse;

                if (data.length === 0) {
                    container.innerHTML = '<p class="empty-state">No reports found.</p>';
                    return;
                }

                container.innerHTML = data.slice(0, 8).map(item => `
                    <article class="report-card">
                        <div><strong>${item.title || 'Untitled report'}</strong><span>${item.created_at ? item.created_at.substring(0, 10) : '-'} · ${(item.user && item.user.name) || 'Anonymous'}</span></div>
                        <div class="report-card-tags"><span class="pill pill-green">${item.type || 'Daily'}</span><span class="pill ${item.status === 'resolved' ? 'pill-green' : 'pill-orange'}">${item.status || 'Pending'}</span></div>
                        <div class="report-card-actions"><button class="btn report-outline" onclick="viewReport(${item.id})">View Details</button><button class="btn report-outline" onclick="downloadReport(${item.id})">Download</button><button class="btn" onclick="openStatusModal(${item.id}, '${item.status || 'pending'}')">Update Status</button><button class="btn report-delete" onclick="deleteItem(${item.id})">Delete</button></div>
                    </article>
                `).join('');
            } catch (error) {
                container.innerHTML = `<p class="empty-state">Error loading data: ${error.message}</p>`;
            }
        }

        async function viewReport(id) {
            try {
                const res = await apiRequest(`${endpoint}/${id}`);
                const report = res.report;
                document.getElementById('details-title').textContent = report.title || 'Report Details';
                document.getElementById('report-details').innerHTML = `
                    <div class="report-detail-status"><span class="pill ${report.status === 'resolved' ? 'pill-green' : 'pill-orange'}">${report.status || 'Pending'}</span></div>
                    <dl><dt>Reported by</dt><dd>${report.user?.name || 'Anonymous'}</dd><dt>Date submitted</dt><dd>${report.created_at ? report.created_at.substring(0, 10) : 'Not recorded'}</dd><dt>Location</dt><dd>${report.location || report.barangay?.name || 'Not recorded'}</dd><dt>Description</dt><dd>${report.description || 'No description recorded.'}</dd><dt>Admin notes</dt><dd>${report.admin_notes || 'No admin notes recorded.'}</dd></dl>`;
                document.getElementById('details-modal').classList.add('active');
            } catch (error) { alert(`Unable to load report: ${error.message}`); }
        }

        function closeDetailsModal() {
            document.getElementById('details-modal').classList.remove('active');
        }

        async function downloadReport(id) {
            try {
                const res = await apiRequest(`${endpoint}/${id}`);
                const blob = new Blob([JSON.stringify(res.report, null, 2)], { type: 'application/json' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `report-${id}.json`;
                link.click();
                URL.revokeObjectURL(link.href);
            } catch (error) { alert(`Unable to download report: ${error.message}`); }
        }

        function openStatusModal(id, currentStatus) {
            document.getElementById('status-modal').classList.add('active');
            document.getElementById('report-id').value = id;
            document.getElementById('status-select').value = currentStatus.toLowerCase();
        }

        function closeModal() {
            document.getElementById('status-modal').classList.remove('active');
        }

        async function deleteItem(id) {
            if(!confirm('Are you sure you want to delete this report?')) return;
            try {
                await apiRequest(`${endpoint}/${id}`, 'DELETE');
                loadData();
            } catch(e) {
                alert('Error deleting: ' + e.message);
            }
        }

        document.getElementById('status-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('report-id').value;
            const status = document.getElementById('status-select').value;

            try {
                await apiRequest(`${endpoint}/${id}/status`, 'PUT', { status });
                closeModal();
                loadData();
            } catch(e) {
                alert('Error updating: ' + e.message);
            }
        });

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
